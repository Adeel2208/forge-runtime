# The default policy bundle.
#
# Bundles are versioned because runs record which bundle authorized them: a
# later "why was that allowed?" must have an exact answer, not an approximate
# one. Change the contents, change the version.
#
# Everything here is deny-by-default. A capability that is not listed is not
# granted, and a tool whose capability is not granted cannot be dispatched --
# see docs/adr/0003-spend-and-capability-governance.md
version: default/1.1.0

budget:
  # Per-run ceilings, all enforced at AUTHORIZE rather than reported at the end.
  usd_ceiling: 5.00
  tokens_per_run: 250000
  wall_clock_seconds: 1800
  max_steps: 24
  max_tool_calls: 32

capabilities:

  INFERENCE:
    granted: true
    allowed_effects: [READ]

  # -- tool capabilities -----------------------------------------------------
  KNOWLEDGE_READ:
    granted: true
    allowed_effects: [READ]

  CALC:
    granted: true
    allowed_effects: [READ]

  WORKSPACE_WRITE:
    granted: true
    max_invocations: 8
    allowed_effects: [READ, REVERSIBLE_WRITE]

  # Declared but ungranted on purpose. The adversarial suite asserts that a
  # declared-but-ungranted capability is refused exactly as firmly as an
  # undeclared one, and the demo uses it to show a live policy denial.
  EXTERNAL_PUBLISH:
    granted: false
    requires_approval: true
    allowed_effects: [IRREVERSIBLE_WRITE]

require_approval_for:
  - IRREVERSIBLE_WRITE

on_denial:
  action: fallback
  log: policy_decision
