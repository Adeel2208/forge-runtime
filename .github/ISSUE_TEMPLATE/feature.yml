name: Feature request
description: Something the runtime should be able to do and cannot.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do that you cannot?
      description: The problem rather than the solution - the fix is often not the obvious one.
    validations: { required: true }
  - type: textarea
    id: today
    attributes:
      label: How do you work around it today?
  - type: checkboxes
    id: deps
    attributes:
      label: Dependencies
      description: >
        The project ships four runtime dependencies deliberately (ADR-0002).
        A fifth needs a reason, not a convenience.
      options:
        - label: This can be built without adding a runtime dependency
