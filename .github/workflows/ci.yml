name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    # Windows is in the matrix because this repository has been bitten twice by
    # platform asymmetry: type-ignores required on one platform are errors on
    # the other, and the Windows sandbox path - Job Objects with
    # KILL_ON_JOB_CLOSE, the mechanism that guarantees a killed run leaves no
    # orphaned processes - had never once executed in CI while Windows was the
    # primary development platform.
    #
    # One Windows entry rather than three: it covers the platform-specific code
    # without tripling the matrix for interpreter differences Linux already
    # exercises.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev,api]"

      # No services, no network, no API keys. The suite runs entirely on
      # MockProvider and SQLite - see ADR-0002 and ADR-0004.
      - name: Test
        run: pytest -q

      - name: Lint
        run: ruff check forge tests scripts

      - name: Type-check
        run: mypy forge

  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev,api]"

      # The harness must fail against deliberately broken targets before its
      # green result on the real case set means anything.
      - name: Harness meta-tests (negative fixtures)
        run: pytest tests/eval -q

      - name: Validate every case set
        run: python -m forge.cli eval validate cases/

      # agent-core only. cases/coding.yaml drives a real model against a real
      # repository (--target coding) and cannot be satisfied by the mock
      # provider CI runs on; pointing the whole directory at --target
      # inprocess fails six cases for the wrong reason.
      - name: Run the evaluation harness
        run: |
          python -m forge.cli eval run cases/agent-core.yaml --target inprocess --out reports/ci-eval
          cat reports/ci-eval/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Failure-injection benchmark
        run: |
          python -m forge.cli bench --trials 1 --out reports/ci-bench
          cat reports/ci-bench/failure_injection.md >> "$GITHUB_STEP_SUMMARY"

      - name: Assert zero duplicate external effects
        run: |
          python - <<'PY'
          import json, sys
          data = json.load(open("reports/ci-bench/failure_injection.json"))
          bad = {k: v["duplicate_effects"]
                 for k, v in data["summary"].items() if v["duplicate_effects"]}
          if bad:
              sys.exit(f"duplicate external effects detected: {bad}")
          print("0 duplicate effects across all fault classes")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-records
          path: reports/

  desktop:
    # The Electron shell and the pages it serves are JavaScript, and the pages
    # live inside Python strings where a dropped backslash becomes a real
    # newline - which imports fine, serves fine, and renders a blank window.
    # Nothing in the Python suite notices, because the API is unaffected.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }

      - name: Install
        run: pip install -e ".[dev,api]"

      - name: The shell parses
        run: node --check desktop/main.js

      - name: The served pages parse
        # These skip when node is absent, so they must run somewhere it is not.
        run: pytest tests/api/test_page_syntax.py tests/api/test_ui_coverage.py -q

      - name: The build is configured correctly
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund 2>/dev/null || npm install --no-audit --no-fund
          # Packaging a file that does not exist is a lie that only shows up in
          # the installer, so check the manifest against the tree.
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const missing = pkg.build.files.filter(f => !f.includes('*') && !fs.existsSync(f));
            if (missing.length) { console.error('listed but absent:', missing); process.exit(1); }
            for (const field of ['author', 'version', 'build']) {
              if (!pkg[field]) { console.error('package.json has no', field); process.exit(1); }
            }
            console.log('packaging manifest is consistent with the tree');
          "

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }

      # Packaging bugs only ever show up through a built artifact, never
      # through an editable install.
      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel --outdir dist

      - name: Install the wheel clean and smoke-test it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --quiet "$(ls dist/*.whl)[api]"
          /tmp/clean/bin/forge --help > /dev/null
          /tmp/clean/bin/python - <<'PY'
          import pathlib
          import forge
          root = pathlib.Path(forge.__file__).parent
          assert (root / "py.typed").exists(), "wheel is missing py.typed"
          assert (root / "security/policies/default.yaml").exists(), \
              "wheel is missing the packaged policy bundle"
          print("wheel ok:", forge.__version__)
          PY

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t forge:ci .

      - name: Boot it and probe
        run: |
          docker run -d --name forge-ci -p 8080:8080 \
            -e FORGE_API_KEYS="ci:ci-secret" forge:ci
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/livez > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/livez
          curl -sf http://127.0.0.1:8080/readyz
          # An unauthenticated write must be refused.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d '{"goal":"x"}' \
            http://127.0.0.1:8080/runs)
          test "$code" = "401" || { echo "expected 401, got $code"; exit 1; }
          echo "container healthy and auth enforced"

      - name: Logs
        if: always()
        run: docker logs forge-ci || true
