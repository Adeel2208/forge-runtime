[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forge-runtime"
version = "0.3.0"
description = "A durable, policy-aware execution runtime for long-horizon AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

# Deliberately small. The runtime depends on no agent framework.
# See docs/adr/0002-no-agent-framework-dependency.md
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "typer>=0.12",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
otel = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp>=1.25"]
api = ["fastapi>=0.111", "uvicorn>=0.30"]
# Only needed to regenerate the README animation from a real run's event log.
media = ["Pillow>=10.0"]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
forge = "forge.cli:app"
forge-server = "forge.api.app:main"

[tool.hatch.build.targets.wheel]
packages = ["forge"]

# Ship the type marker so downstream consumers get types, and the packaged
# policy bundle so a default deployment works without a config file.
artifacts = ["forge/py.typed", "forge/security/policies/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "recovery: crash/resume correctness tests",
    "adversarial: tests that attempt to defeat the trust plane",
    "slow: excluded from the default fast loop",
]
filterwarnings = ["error::DeprecationWarning:forge.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = []

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
